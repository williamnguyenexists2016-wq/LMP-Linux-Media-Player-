name: Build LMP Debian Package

on:
  push:
  workflow_dispatch:


jobs:

  build-deb:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-mpv pillow pillow-heif


    - name: Check LMP syntax
      run: |
        python -m py_compile "LMP.py"


    - name: Create Debian structure
      run: |
        mkdir -p deb/LMP/DEBIAN
        mkdir -p deb/LMP/usr/bin
        mkdir -p deb/LMP/usr/share/lmp
        mkdir -p deb/LMP/usr/share/applications


    - name: Copy LMP files
      run: |
        cp "LMP.py" deb/LMP/usr/share/lmp/LMP.py


    - name: Create launcher
      run: |
        cat > deb/LMP/usr/bin/lmp <<EOF
#!/bin/bash
python3 /usr/share/lmp/LMP.py
EOF

        chmod +x deb/LMP/usr/bin/lmp


    - name: Create Debian control file
      run: |
        cat > deb/LMP/DEBIAN/control <<EOF
Package: lmp
Version: 1.0.0
Section: video
Priority: optional
Architecture: all
Maintainer: LMP Developer
Depends: python3, python3-tk, mpv
Description: Linux Media Player
 A Python based media player using mpv.
EOF


    - name: Create desktop entry
      run: |
        cat > deb/LMP/usr/share/applications/lmp.desktop <<EOF
[Desktop Entry]
Name=LMP
Comment=Linux Media Player
Exec=lmp
Terminal=false
Type=Application
Categories=AudioVideo;Player;
EOF


    - name: Build Debian package
      run: |
        dpkg-deb --build deb/LMP
        mv deb/LMP.deb LMP-linux.deb


    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: LMP-DEB
        path: LMP-linux.deb
