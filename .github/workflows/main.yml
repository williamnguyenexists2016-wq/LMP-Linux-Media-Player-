name: Build LMP Beta (.deb)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile LMP.py

      - name: Create package folders
        run: |
          mkdir -p package/LMP/DEBIAN
          mkdir -p package/LMP/usr/bin
          mkdir -p package/LMP/usr/share/lmp
          mkdir -p package/LMP/usr/share/applications
          mkdir -p package/LMP/usr/share/icons/hicolor/512x512/apps

      - name: Copy application files
        run: |
          cp LMP.py package/LMP/usr/share/lmp/LMP.py
          cp lmp.png package/LMP/usr/share/icons/hicolor/512x512/apps/lmp.png

      - name: Create launcher
        run: |
          printf '#!/bin/sh\nexec python3 /usr/share/lmp/LMP.py "$@"\n' > package/LMP/usr/bin/lmp
          chmod 755 package/LMP/usr/bin/lmp

      - name: Create control file
        run: |
          printf 'Package: lmp\nVersion: 1.0.0-beta\nSection: video\nPriority: optional\nArchitecture: all\nMaintainer: William Nguyen\nDepends: python3, python3-tk, mpv\nDescription: Linux Media Player (Beta)\n A media player written in Python using mpv.\n' > package/LMP/DEBIAN/control

      - name: Create desktop entry
        run: |
          printf '[Desktop Entry]\nName=LMP Beta\nComment=Linux Media Player\nExec=lmp\nIcon=lmp\nTerminal=false\nType=Application\nCategories=AudioVideo;Player;\nStartupNotify=true\n' > package/LMP/usr/share/applications/lmp.desktop

      - name: Build Debian package
        run: |
          dpkg-deb --build package/LMP
          mv package/LMP.deb LMP-1.0.0-beta.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: LMP-1.0.0-beta
          path: LMP-1.0.0-beta.deb
