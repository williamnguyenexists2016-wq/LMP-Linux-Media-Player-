name: Build LMP Beta (.deb)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile LMP.py

      - name: Create package folders
        run: |
          mkdir -p package/LMP/DEBIAN
          mkdir -p package/LMP/usr/bin
          mkdir -p package/LMP/usr/share/lmp
          mkdir -p package/LMP/usr/share/applications
          mkdir -p package/LMP/usr/share/icons/hicolor/512x512/apps

      - name: Copy application files
        run: |
          cp LMP.py package/LMP/usr/share/lmp/LMP.py
          cp lmp.png package/LMP/usr/share/icons/hicolor/512x512/apps/lmp.png

      - name: Create launcher
        run: |
          cat > package/LMP/usr/bin/lmp <<EOF
#!/bin/sh
exec python3 /usr/share/lmp/LMP.py "\$@"
EOF
          chmod 755 package/LMP/usr/bin/lmp

      - name: Create Debian control file
        run: |
          cat > package/LMP/DEBIAN/control <<EOF
Package: lmp
Version: 1.0.0-beta
Section: video
Priority: optional
Architecture: all
Maintainer: William Nguyen
Depends: python3, python3-tk, mpv
Description: Linux Media Player (Beta)
 A media player written in Python using mpv.
EOF

      - name: Create desktop entry
        run: |
          cat > package/LMP/usr/share/applications/lmp.desktop <<EOF
[Desktop Entry]
Name=LMP Beta
Comment=Linux Media Player
Exec=lmp
Icon=lmp
Terminal=false
Type=Application
Categories=AudioVideo;Player;
StartupNotify=true
EOF

      - name: Build Debian package
        run: |
          dpkg-deb --build package/LMP
          mv package/LMP.deb LMP-1.0.0-beta.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: LMP-1.0.0-beta
          path: LMP-1.0.0-beta.deb
